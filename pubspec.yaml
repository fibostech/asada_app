name: asada_app
description: "Sistema SaaS modular para ASADAS — App Flutter offline para fontaneros"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  isar: ^3.0.0
  dio: ^5.0.0
  image_picker: ^3.0.0
  path: ^1.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/